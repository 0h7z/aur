on:
  workflow_dispatch: ~
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/repo-sync.yml"
  schedule:
    - cron: "0 */4 * * *"

jobs:
  apt-zsh-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          token: ${{ secrets.PAT }}
      - run: |-
          git version
          git config --global color.ui always
          git config --global log.date iso
          git config --global log.decorate short
          git remote -v
          git remote add  upstream https://github.com/archlinux/aur.git  -f -t apt-zsh-completion
          git push origin upstream/apt-zsh-completion:refs/heads/apt-zsh-completion -f
